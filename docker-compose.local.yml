x-api-environment: &api-environment
  APP_NAME: BudgetFlow
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8086
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: budgetflow
  DB_USERNAME: budgetflow
  DB_PASSWORD: secret
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_CACHE_DB: 1
  REDIS_CACHE_CONNECTION: cache
  REDIS_QUEUE_CONNECTION: default
  REDIS_QUEUE: default
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: file
  BROADCAST_CONNECTION: reverb
  HORIZON_PATH: horizon
  REVERB_APP_ID: budgetflow-local
  REVERB_APP_KEY: budgetflow-local-key
  REVERB_APP_SECRET: budgetflow-local-secret
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: 8080
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  VITE_REVERB_APP_KEY: budgetflow-local-key
  VITE_REVERB_HOST: localhost
  VITE_REVERB_PORT: 8091
  VITE_REVERB_SCHEME: http

x-api-service: &api-service
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  working_dir: /var/www/html
  environment:
    <<: *api-environment
  volumes:
    - ./apps/api:/var/www/html
  networks:
    - budgetflow-local
  restart: unless-stopped

services:
  # Vue 3/Vite development server.
  web:
    image: node:22-alpine
    container_name: budgetflow-web
    working_dir: /app/apps/web
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "3000:5173"
    volumes:
      - ./:/app
    networks:
      - budgetflow-local
    restart: unless-stopped

  # Laravel PHP-FPM runtime. Composer is available inside this container.
  api-php:
    <<: *api-service
    container_name: budgetflow-api-php
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nginx entrypoint for the Laravel API.
  api-nginx:
    image: nginx:alpine
    container_name: budgetflow-api-nginx
    ports:
      - "8086:80"
    volumes:
      - ./apps/api:/var/www/html:ro
      - ./docker/nginx/api.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-php
    networks:
      - budgetflow-local
    restart: unless-stopped

  # Laravel Horizon queue dashboard and worker supervisor.
  horizon:
    <<: *api-service
    container_name: budgetflow-horizon
    command: php artisan horizon
    depends_on:
      api-php:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Laravel scheduler worker for scheduled commands.
  scheduler:
    <<: *api-service
    container_name: budgetflow-scheduler
    command: php artisan schedule:work
    depends_on:
      api-php:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Laravel Reverb WebSocket server for future real-time features.
  reverb:
    <<: *api-service
    container_name: budgetflow-reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8091:8080"
    depends_on:
      api-php:
        condition: service_started
      redis:
        condition: service_healthy

  # Local PostgreSQL database.
  postgres:
    image: postgres:16-alpine
    container_name: budgetflow-postgres
    environment:
      POSTGRES_DB: budgetflow
      POSTGRES_USER: budgetflow
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetflow -d budgetflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - budgetflow-local
    restart: unless-stopped

  # Local Redis instance for future cache, queues, and rate limiting.
  redis:
    image: redis:7-alpine
    container_name: budgetflow-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - budgetflow-local
    restart: unless-stopped

networks:
  budgetflow-local:
    name: budgetflow-local
    driver: bridge

volumes:
  postgres-data:
    name: budgetflow-postgres-data
  redis-data:
    name: budgetflow-redis-data
